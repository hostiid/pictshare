name: Build and Deploy

on:
  push:
    branches:
      - "master-dockerfile"

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_REGISTRY: docker.io
  DEPLOY_REGISTRY: registry.hub.docker.com
  IMAGE_NAME: hostiid/base-image

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner}}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DEPLOY_REGISTRY }}
        username: hostiid
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Login to Cache Registry (docker.io)
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: hostiid
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Set image URL
      id: meta
      run: |
        REPO_NAME=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')
        BRANCH_NAME=$(echo ${{ github.head_ref || github.ref_name }} | tr '[:upper:]' '[:lower:]' | tr '/' '-')
        COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

        echo "image_url=${DEPLOY_REGISTRY}/${IMAGE_NAME}:${REPO_NAME}_${BRANCH_NAME}_${COMMIT_SHA}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

        echo "cache_ref=${CACHE_REGISTRY}/${IMAGE_NAME}:${REPO_NAME}_${BRANCH_NAME}-buildcache-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
        echo "gha_scope=staging-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        push: true
        tags: ${{ steps.meta.outputs.image_url }}
        cache-from: |
          type=registry,ref=${{ steps.meta.outputs.cache_ref }}
          type=gha,scope=${{ steps.meta.outputs.gha_scope }}
        cache-to: |
          type=registry,ref=${{ steps.meta.outputs.cache_ref }},mode=max
          type=gha,scope=${{ steps.meta.outputs.gha_scope }},mode=max

  manifest:
    name: Publish multi-arch Manifest   
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      image_url: ${{ steps.meta.outputs.image_url }}

    steps:
    - name: setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DEPLOY_REGISTRY }}
        username: hostiid
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: set image metadata
      id: meta
      run: |
        REPO_NAME=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')
        BRANCH_NAME=$(echo ${{ github.head_ref || github.ref_name }} | tr '[:upper:]' '[:lower:]' | tr '/' '-')
        COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        echo "image_url=${DEPLOY_REGISTRY}/${IMAGE_NAME}:${REPO_NAME}_${BRANCH_NAME}_${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
        echo "amd64_image=${DEPLOY_REGISTRY}/${IMAGE_NAME}:${REPO_NAME}_${BRANCH_NAME}_${COMMIT_SHA}-amd64" >> "$GITHUB_OUTPUT"
        echo "arm64_image=${DEPLOY_REGISTRY}/${IMAGE_NAME}:${REPO_NAME}_${BRANCH_NAME}_${COMMIT_SHA}-arm64" >> "$GITHUB_OUTPUT"

    - name: Create and push multi-arch manifest
      run: |
        docker buildx imagetools create \
          --tag "${{ steps.meta.outputs.image_url }}" \
          "${{ steps.meta.outputs.amd64_image }}" \
          "${{ steps.meta.outputs.arm64_image }}"

    - name: save image url to file
      run: |
        echo "${{ steps.meta.outputs.image_url }}" > image_url.txt

    - name: upload image url as artifact
      uses: actions/upload-artifact@v4
      with:
        name: image-url-caprover
        path: image_url.txt
        retention-days: 1

    # - name: Inspect multi-arch manifest
    #   run: docker buildx imagetools inspect "${{ steps.meta.outputs.image_url }}"

  deploy:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    # Unduh kembali file teks nama image tadi
    - name: Download Image URL Artifact
      uses: actions/download-artifact@v4
      with:
        name: image-url-caprover

    # Ekstrak isi file teks ke dalam ENV lokal komputer deploy
    - name: Load Image URL to Environment
      run: |
        REAL_URL=$(cat image_url.txt)
        echo "IMAGE_URL_FINAL=$REAL_URL" >> $GITHUB_ENV

    - name: Deploy Image to CapRrover
      uses: Akise17/deploy-caprover-from-github@v1.1.3
      with:
        server: "${{ secrets.CAPROVER_DEV_HOST }}"
        app: ${{ secrets.CAPROVER_DEV_APP }}
        password: "${{ secrets.CAPROVER_PASSWORD }}"
        image: ${{ env.IMAGE_URL_FINAL }}