name: Build and Deploy

on:
  push:
    tags: [ image-* ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
            registry: registry.hub.docker.com
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Preset Image Name
      run: |
        REPO_NAME=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')
        BRANCH_NAME=$(echo ${{ github.head_ref || github.ref_name }} | tr '[:upper:]' '[:lower:]' | tr '/' '-')
        COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        echo "IMAGE_URL=registry.hub.docker.com/${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPOSITORY }}:${REPO_NAME}_${BRANCH_NAME}_${COMMIT_SHA}" >> $GITHUB_ENV

    - name: Build and push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ env.IMAGE_URL }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy Image to CapRrover
      uses: Akise17/deploy-caprover-from-github@v1.1.3
      with:
        server: "${{ secrets.CAPROVER_HOST }}"
        app: ${{ secrets.CAPROVER_APP }}
        password: "${{ secrets.CAPROVER_PASSWORD }}"
        image: ${{ env.IMAGE_URL }}